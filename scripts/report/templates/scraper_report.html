<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scraper Report</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; line-height: 1.4; padding: 24px; color: #111; }
    h1 { margin: 0 0 16px 0; }
    h2 { margin: 24px 0 8px 0; font-size: 18px; }
    .root { font-weight: 600; }
    .muted { color: #666; }
    .playlist { margin-bottom: 12px; }
    details { border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; }
    summary { display: flex; gap: 10px; align-items: baseline; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .count { color: #444; font-size: 12px; margin-left: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 13px; }
    th { color: #333; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Scraper Report</h1>
  {{CONTENT}}
</body>
</html>

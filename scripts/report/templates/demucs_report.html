<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demucs Report</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #f8fafc; color: #0f172a; margin: 24px; }
    h1 { margin: 0 0 8px 0; }
    table { border-collapse: collapse; width: 100%; margin: 10px 0 14px 0; }
    th, td { border: 1px solid #e2e8f0; padding: 8px 10px; font-size: 13px; text-align: left; }
    th { background: #f1f5f9; }
    .muted { color: #475569; font-size: 13px; }
    .summary-table td:nth-child(1) { width: 60%; }
    .root { margin-top: 10px; }
    details { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; background: #fff; }
    summary { display: flex; gap: 12px; align-items: baseline; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .counts { margin-left: auto; color: #475569; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Demucs Report</h1>
  {{CONTENT}}
</body>
</html>

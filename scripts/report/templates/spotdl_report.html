<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpotDL Report</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #f8fafc; color: #0f172a; margin: 24px; }
    h1 { margin: 0 0 6px 0; }
    h2 { margin: 22px 0 8px 0; font-size: 18px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; margin-bottom: 16px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px 10px; font-size: 13px; }
    th { background: #f1f5f9; text-align: left; }
    tr.status-downloaded { background: #ecfdf3; }
    tr.status-failed { background: #fef2f2; }
    tr.status-missing { background: #fffbeb; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .badge-downloaded { background: #16a34a; color: #f8fafc; }
    .badge-failed { background: #dc2626; color: #f8fafc; }
    .badge-missing { background: #d97706; color: #f8fafc; }
    .summary-table td:nth-child(1) { width: 38%; }
    .muted { color: #475569; font-size: 13px; }
    .small { font-size: 12px; }
    .playlist { margin-top: 10px; }
    details { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; background: #fff; }
    summary { display: flex; gap: 12px; align-items: baseline; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .root { font-weight: 600; }
    .counts { margin-left: auto; color: #475569; font-size: 12px; }
  </style>
</head>
<body>
  <h1>SpotDL Report</h1>
  {{CONTENT}}
</body>
</html>
